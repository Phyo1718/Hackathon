# EXAMPLE – not tested on a cluster.
# The Gemini API key as a Kubernetes Secret. Do not commit a filled-in copy; create it with:
#   kubectl create secret generic procurement-assistant-secrets --from-literal=GEMINI_API_KEY=<your key>
apiVersion: v1
kind: Secret
metadata:
  name: procurement-assistant-secrets
type: Opaque
stringData:
  GEMINI_API_KEY: your-key-here
